name: Moonshine CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Path deps expect siblings:
#   darkfi/
#   darkfi-lightwalletd/
#   moonshine/   ← this repo
jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonshine
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonshine

      - name: Checkout darkfi
        uses: actions/checkout@v4
        with:
          repository: darkrenaissance/darkfi
          path: darkfi

      - name: Checkout darkfi-lightwalletd
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/darkfi-lightwalletd
          path: darkfi-lightwalletd

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        working-directory: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            moonshine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moonshine/Cargo.lock') }}

      - name: Cargo check
        run: cargo check --all-targets

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonshine
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonshine

      - name: Checkout darkfi
        uses: actions/checkout@v4
        with:
          repository: darkrenaissance/darkfi
          path: darkfi

      - name: Checkout darkfi-lightwalletd
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/darkfi-lightwalletd
          path: darkfi-lightwalletd

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            moonshine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moonshine/Cargo.lock') }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        working-directory: .

      - name: Run tests
        run: cargo test --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonshine
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonshine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonshine
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonshine

      - name: Checkout darkfi
        uses: actions/checkout@v4
        with:
          repository: darkrenaissance/darkfi
          path: darkfi

      - name: Checkout darkfi-lightwalletd
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/darkfi-lightwalletd
          path: darkfi-lightwalletd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        working-directory: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            moonshine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('moonshine/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, test]
    defaults:
      run:
        working-directory: moonshine
    steps:
      - uses: actions/checkout@v4
        with:
          path: moonshine

      - name: Checkout darkfi
        uses: actions/checkout@v4
        with:
          repository: darkrenaissance/darkfi
          path: darkfi

      - name: Checkout darkfi-lightwalletd
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/darkfi-lightwalletd
          path: darkfi-lightwalletd

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            moonshine/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('moonshine/Cargo.lock') }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        working-directory: .

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-linux-amd64
          path: moonshine/target/release/moonshine
